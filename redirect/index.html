<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReBuilted Games - Signing in</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="hero container">
      <header class="site-header">
        <div class="brand">
          <div class="brand-badge">RG</div>
          <div>
            <div class="brand-title">Signing in</div>
            <div class="brand-caption">Finishing your Roblox login and returning to the site.</div>
          </div>
        </div>
      </header>
      <section class="panel">
        <h1 class="page-title">Signing in</h1>
        <p class="lead">This page is processing your Roblox sign-in and will send you back automatically.</p>
        <div id="status" class="status-banner">Completing sign-in…</div>
        <div class="site-footer" style="margin-top: 20px;">
          <span><a href="../">Go back to the main site</a></span>
        </div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const savedState = sessionStorage.getItem('rbx_oauth_state');
      const status = document.getElementById('status');
      const cleanUrl = `${window.location.origin}${window.location.pathname}`;

      history.replaceState(null, '', cleanUrl);

      if (!code || !state || state !== savedState) {
        status.textContent = 'No Roblox sign-in response was found.';
      } else {
        status.textContent = 'Completing sign-in…';
        sessionStorage.setItem('rbx_pending_code', code);
        sessionStorage.setItem('rbx_pending_state', state);

        const redirectUri = cleanUrl;

        fetch('/.netlify/functions/roblox-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, redirectUri })
        })
          .then(async (res) => {
            const result = await res.json().catch(() => ({}));
            if (result.success && result.profile) {
              sessionStorage.setItem('rbx_profile', JSON.stringify(result.profile));
              window.location.replace('../');
              return;
            }
            sessionStorage.setItem('rbx_auth_error', result.error || 'The sign-in could not be completed.');
            status.textContent = result.error || 'The sign-in could not be completed.';
            setTimeout(() => {
              window.location.replace('../');
            }, 1800);
          })
          .catch(() => {
            sessionStorage.setItem('rbx_auth_error', 'The sign-in could not be completed.');
            status.textContent = 'The sign-in could not be completed.';
            setTimeout(() => {
              window.location.replace('../');
            }, 1800);
          });
      }
    </script>
  </body>
</html>
