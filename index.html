<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReBuilted Games - Group</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <h1 id="group-name"></h1>
            <p id="group-owner"></p>
        </div>
    </header>

    <main class="container">
        <section id="about">
            <div class="card">
                <h2>About Us</h2>
                <p id="group-description"></p>
                <div class="stats">
                    <div class="stat-item">
                        <h3>Members</h3>
                        <p id="member-count">...</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="announcements">
            <h2>Latest Announcements</h2>
            <div id="announcements-list" class="card-list">
                <!-- Announcements will be loaded here by JavaScript -->
            </div>
        </section>

        <section id="gallery">
            <h2>Gallery</h2>
            <div id="gallery-grid">
                <!-- Gallery images will be loaded here by JavaScript -->
            </div>
        </section>

        <section id="forum">
            <h2>Active Forum Threads</h2>
            <div id="forum-threads" class="card-list">
                <!-- Forum threads will be loaded here by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <a id="group-link" href="#" target="_blank" rel="noopener noreferrer">Join The Group on Roblox</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
